name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.freefire --project-name freefire_images .

      - name: Draw the logo (hexagon + flame)
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          os.makedirs('assets', exist_ok=True)
          S = 1024
          sc = 8.4
          off = (S - 100 * sc) / 2
          def pts(a):
              return [(off + x * sc, off + y * sc) for x, y in a]
          hexa = [(50,2),(93,26),(93,74),(50,98),(7,74),(7,26)]
          flame = [(50,6),(62,26),(72,44),(76,62),(68,80),(50,92),(32,80),(24,62),(30,46),(38,56),(42,36)]
          inner = [(50,40),(58,56),(60,70),(50,82),(40,70),(43,56)]
          im = Image.new('RGB', (S, S), (11, 11, 16))
          d = ImageDraw.Draw(im)
          h = pts(hexa)
          d.polygon(h, fill=(24, 24, 34))
          d.line(h + [h[0]], fill=(255, 106, 0), width=26, joint='curve')
          d.polygon(pts(flame), fill=(255, 106, 0))
          d.polygon(pts(inner), fill=(255, 200, 0))
          im.save('assets/logo.png')
          PY

      - name: Patch AndroidManifest (internet permission + app name)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('<application',
              '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace('android:label="freefire_images"', 'android:label="ساحة فري فاير"')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - name: Generate app icon from logo
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: freefire-images-apk
          path: build/app/outputs/flutter-apk/app-release.apk
